services:
  app:
    build: .
    # Kein öffentlicher Host-Port: Ingress läuft über den Reverse-Proxy (Traefik)
    # via docker-compose.override.yml. Für Standalone-Tests ggf. ports ergänzen.
    expose:
      - "4321"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      DATABASE_PATH: /data/vm.sqlite
    volumes:
      - vm-data:/data
    restart: unless-stopped

volumes:
  vm-data:
